/* =========================================================
   رابط Google Apps Script الخاص بجهات الاتصال

const contactsURL =
'https://script.google.com/macros/s/AKfycbwjbV7W0VhwHiVFK318UL4-Q7PjabCkF_k84rfmG2_iOU4QZ8IVUP0vTNVl66nGCODl1A/exec';


/* =========================================================
   تحويل الأرقام العربية إلى إنجليزية
   ========================================================= */

function convertNumbers(str) {

    if (!str) return "";

    const arabicNums = [
        /٠/g,
        /١/g,
        /٢/g,
        /٣/g,
        /٤/g,
        /٥/g,
        /٦/g,
        /٧/g,
        /٨/g,
        /٩/g
    ];

    for (let i = 0; i < 10; i++) {
        str = str.replace(arabicNums[i], i);
    }

    return str;
}


/* =========================================================
   حفظ العميل في Google Contacts
   ========================================================= */

function saveContactToGoogle(clientName, clientPhone) {

    if (
        !contactsURL ||
        contactsURL === 'PUT_CONTACTS_WEB_APP_URL_HERE'
    ) {
        console.warn(
            'رابط Google Contacts لم يتم وضعه بعد.'
        );
        return;
    }

    const cleanName = String(clientName || '').trim();

    const cleanPhone = convertNumbers(
        String(clientPhone || '').trim()
    );

    if (!cleanName || !cleanPhone) {
        console.warn(
            'الاسم أو رقم الهاتف غير موجود.'
        );
        return;
    }

    const data = {
        name: cleanName,
        phone: cleanPhone
    };

    fetch(contactsURL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(data)
    })
    .then(() => {

        console.log(
            'تم إرسال بيانات العميل إلى Google Contacts.'
        );

    })
    .catch(error => {

        console.error(
            'Google Contacts Error:',
            error
        );

    });
}

/* =========================================================
   الحقول المشروطة
   ========================================================= */

function handleConditionalFields() {

    const val =
        document.getElementById('session-type').value;


    if (
        val &&
        val.includes("كتب كتاب في البيت")
    ) {

        document
        .getElementById('time-selection')
        .style.display = "block";

    } else {

        document
        .getElementById('time-selection')
        .style.display = "none";

    }


    if (
        val &&
        (
            val.includes("كتب كتاب في البيت") ||
            val.includes("خطوبة في البيت أو كافيه")
        )
    ) {

        document
        .getElementById('address-selection')

            val.includes("قاعة") ||

        .getElementById('hall-selection')
        .style.display = "block";

    if (
        val &&

    ) {

    } else {

        .getElementById('university-selection')
        .style.display = "none";

    }

}


/* =========================================================
   إرسال الحجز وتوليد كرت جهات الاتصال (vCard)
   ========================================================= */

function sendToWhatsApp() {

    const name =
        document.getElementById('user-name').value.trim();

    const phone =
        convertNumbers(
            document.getElementById('user-phone').value.trim()
        );

    const type =
        document.getElementById('session-type').value;

    const date =
        document.getElementById('session-date').value;

    const time =
        document.getElementById('session-time').value;

    const address =
        document.getElementById('user-address').value.trim();

    const hall =
        document.getElementById('hall-name').value.trim();

    const university =
        document.getElementById('university-name').value.trim();


    /* =====================================================
       التحقق الأساسي
       ===================================================== */

    if (!type || !date || !name || !phone) {

        alert(
            "من فضلك كمل البيانات الأول يا فندم"
        );

        return;

    }


    /* =====================================================
       التحقق من موعد كتب الكتاب
       ===================================================== */

    if (
        type.includes("كتب كتاب في البيت") &&
        !time
    ) {

        alert(
            "من فضلك اختر موعد كتب الكتاب أولاً يا فندم"
        );

        return;

    }


    /* =====================================================
       التحقق من العنوان
       ===================================================== */

    const needsAddress =
        type.includes("كتب كتاب في البيت") ||
        type.includes("خطوبة في البيت أو كافيه");


    if (
        needsAddress &&
        !address
    ) {

        alert(
            "من فضلك ادخل العنوان بالتفصيل أولاً يا فندم"
        );

        return;

    }


    /* =====================================================
       التحقق من القاعة
       ===================================================== */

    const needsHall =
        type.includes("قاعة") ||
        type.includes("فرح");


    if (
        needsHall &&
        !hall
    ) {

        alert(
            "من فضلك ادخل اسم القاعة أو مكان الفرح أولاً يا فندم"
        );

        return;

    }


    /* =====================================================
       التحقق من الجامعة
       ===================================================== */

    const needsUniversity =
        type.includes("مناقشة ماجستير");


    if (
        needsUniversity &&
        !university
    ) {

        alert(
            "من فضلك ادخل اسم الجامعة أولاً يا فندم"
        );

        return;

    }


    /* =====================================================
       حفظ العميل في Google Contacts
       ===================================================== */

    saveContactToGoogle(
        name,
        phone
    );


    /* =====================================================
       توليد رابط vCard مباشر للرقم والاسم داخل الرسالة
       ===================================================== */

    const vCardData = 
`BEGIN:VCARD
VERSION:3.0
FN:${name} (عريس/عروسة)
TEL:${phone}
NOTE:حجز من موقع إسلام المقدم
END:VCARD`;

    const base64VCard = btoa(unescape(encodeURIComponent(vCardData)));
    const vCardUrl = `data:text/vcard;base64,${base64VCard}`;


    /* =====================================================
       بيانات الحجز الحالية
       ===================================================== */

    const bookingData =
        JSON.stringify({

            name: name,
            phone: phone,
            type: type,
            date: date,
            time: time,
            address: address,
            hall: hall,
            university: university

        });


    /* =====================================================
       Google Calendar
       ===================================================== */

    fetch(
        calendarURL,
        {
            method: 'POST',
            mode: 'no-cors',
            body: bookingData
        }
    );


    /* =====================================================
       Google Sheets / Accounts
       ===================================================== */

    fetch(
        accountsURL,
        {
            method: 'POST',
            mode: 'no-cors',
            body: bookingData
        }
    );


    /* =====================================================
       رسالة WhatsApp (بنفس تنسيقك بالضبط مع إضافة رابط vCard)
       ===================================================== */

    let msg =
        `تمام يا مقدم، تم الحجز :\n` +
        `الاسم: ${name}\n` +
        `الرقم: ${phone}\n` +
        `المناسبة: ${type}\n` +
        `التاريخ: ${date}`;


    if (
        type.includes("كتب كتاب في البيت")
    ) {

        msg +=
            `\nالموعد: ${time}`;

    }


    if (needsAddress) {

        msg +=
            `\nالعنوان: ${address}`;

    }


    if (needsHall) {

        msg +=
            `\nمكان الفرح/القاعة: ${hall}`;

    }


    if (needsUniversity) {

        msg +=
            `\nاسم الجامعة: ${university}`;

    }

    // إضافة اللينك المختصر في آخر الرسالة
    msg += `\n\n📥 اضغط هنا لحفظ الرقم (vCard):\n${vCardUrl}`;


    window.open(
        `https://wa.me/201210425901?text=${encodeURIComponent(msg)}`,
        '_blank'
    );


    closeBooking();

}

/* =========================================================
   تحميل الصفحة
   ========================================================= */

window.onload = function() {

    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const selectedPackage =
        urlParams.get('package');


    if (selectedPackage) {

        openBooking();


        const sessionSelect =
            document.getElementById('session-type');


        let found = false;

            let i = 0;
            i < sessionSelect.options.length;
            i++
        ) {

            if (
                sessionSelect.options[i]
                .value
                .trim()
                .startsWith(
                    selectedPackage.trim()
                )
            ) {

                sessionSelect.selectedIndex = i;

                found = true;

                break;

            }

        }


        if (!found) {

            const newOption =
                new Option(
                    selectedPackage,
                    selectedPackage
                );

            sessionSelect.add(newOption);

            sessionSelect.value =
                selectedPackage;

        }


        handleConditionalFields();

    }


    /* =====================================================
       Telegram
       ===================================================== */

    const source =
        urlParams.get('utm_source') ||
        "رابط مباشر";


    const token =
        "7769219526:AAGL3eyYRgdSQRcX2jbpkEgFEnsHcCgnrcs";


    const chat_id =
        "720656827";


    fetch(
        'https://ipapi.co/json/'
    )
    .then(res => res.json())
    .then(data => {

        const device =
            /iPhone|iPad|iPod/i.test(

            `📱 الجهاز: ${device}\n` +
            `📍 المكان: ${data.city || 'غير معروف'}\n` +
            `🔗 المصدر: ${source}\n` +
            `⏰ الوقت: ${now}`;


        fetch(
            `https://api.telegram.org/bot${token}/sendMessage`,
            {
                method: 'POST',
                headers: {
                    'Content-Type':
                        'application/json'
                },
                body: JSON.stringify({
                    chat_id: chat_id,
                    text: msg
                })
            }
        );

    })
    .catch(
        e => console.log("Log Error")
    );

};
